name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch — pushing a fix immediately
# supersedes the previous attempt instead of both racing to green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit:
    name: Typecheck + Vitest + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Explicit lint step so a bad tsc failure shows up under the right
      # label in the PR check list rather than muddled with a build error.
      - name: TypeScript
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # The tests create and change data, so they run on an empty Postgres that
    # lives only for this job, never the real database. The server creates
    # its tables, sample items and projects, and the test admin on start-up.
    # Needs no secrets, so pull requests from forks can run it too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracklab_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Playwright pins a specific Chromium build per version; caching it
      # cuts ~30s off every subsequent CI run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        env:
          E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tracklab_e2e
          TEST_ADMIN_EMAIL: e2e-admin@tracklab.test
          TEST_ADMIN_PASSWORD: e2e-only-password-1
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
      # The full log needs a GitHub sign-in to read; annotations don't. Turn
      # the server's errors into annotations so a failure explains itself.
      - name: Failed tests as annotations
        if: failure()
        run: node scripts/e2e-failures.mjs e2e-results.json || true
      - name: Server errors as annotations
        if: failure()
        run: |
          grep -E '\[WebServer\].*([Ee]rror|[Ff]ailed|ERROR|relation .* does not exist)' e2e.log | head -20 | while IFS= read -r line; do
            echo "::error title=E2E server::${line//%/%25}"
          done || true
      # Upload the HTML report on failure so we can inspect screenshots +
      # video + trace without re-running the flaky path locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
